<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- El tag title se puede sobreescribir desde otras plantillas usando el bloque 'title' -->
    <title>{% block title %}Academic Project{% endblock %}</title>
    <!-- Importamos Bootstrap 5 para dar estilos y hacer la página responsiva fácilmente -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bloque opcional por si otra página necesita su propio archivo CSS -->
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">

<!-- Barra de navegación principal que aparecerá arriba en TODAS las páginas -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <!-- Logo / Nombre del proyecto que siempre lleva al inicio ('/') -->
        <a class="navbar-brand fw-bold" href="/">Academic Project</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Menú de enlaces (Cursos, Estudiantes) colapsable en pantallas pequeñas -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/docentes/">Docentes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/cursos/">Cursos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/estudiantes/">Estudiantes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-bold" href="/admin/" target="_blank">Panel de Administración</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Contenedor principal. Aquí se inyectará el HTML dinámico de las otras plantillas -->
<div class="container">
    {% block content %}{% endblock %}
</div>

<!-- Importamos el JavaScript de Bootstrap para el menú responsivo móvil y otros componentes dinámicos -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Bloque opcional para inyectar scripts (como el código de fetch) desde las otras plantillas -->
{% block extra_js %}{% endblock %}
</body>
</html>
