{% extends 'library/base.html' %}
{% block content %}
<h2 class="mb-4">Listado de Libros</h2>
<table class="table table-striped table-hover shadow-sm bg-white">
    <thead class="table-dark">
        <tr><th>ID</th><th>Título</th><th>Autor</th></tr>
    </thead>
    <tbody id="books-tbody">
        <tr><td colspan="3" class="text-center">Cargando...</td></tr>
    </tbody>
</table>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const [booksRes, authorsRes] = await Promise.all([
            fetch('/api/books/'), fetch('/api/authors/')
        ]);
        const books = await booksRes.json();
        const authors = await authorsRes.json();
        const authorsMap = {};
        authors.forEach(a => authorsMap[a.id] = `${a.first_name} ${a.last_name}`);
        
        const tbody = document.getElementById('books-tbody');
        tbody.innerHTML = '';
        if(books.length === 0) return tbody.innerHTML = '<tr><td colspan="3" class="text-center">No hay libros.</td></tr>';
        
        books.forEach(b => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${b.id}</td><td>${b.title}</td><td>${authorsMap[b.author] || 'Desconocido'}</td>`;
            tbody.appendChild(tr);
        });
    } catch(err) {
        document.getElementById('books-tbody').innerHTML = '<tr><td colspan="3" class="text-danger text-center">Error cargando API.</td></tr>';
    }
});
</script>
{% endblock %}
