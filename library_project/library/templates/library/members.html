{% extends 'library/base.html' %}
{% block content %}
<h2 class="mb-4">Listado de Socios</h2>
<table class="table table-striped table-hover shadow-sm bg-white">
    <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Apellido</th></tr>
    </thead>
    <tbody id="members-tbody">
        <tr><td colspan="3" class="text-center">Cargando...</td></tr>
    </tbody>
</table>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/api/members/');
        const members = await res.json();
        const tbody = document.getElementById('members-tbody');
        tbody.innerHTML = '';
        if(members.length === 0) return tbody.innerHTML = '<tr><td colspan="3" class="text-center">No hay socios.</td></tr>';
        
        members.forEach(m => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${m.id}</td><td>${m.first_name}</td><td>${m.last_name}</td>`;
            tbody.appendChild(tr);
        });
    } catch(err) {
        document.getElementById('members-tbody').innerHTML = '<tr><td colspan="3" class="text-danger text-center">Error cargando API.</td></tr>';
    }
});
</script>
{% endblock %}
